services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: postmark
      POSTGRES_USER: postmark
      POSTGRES_PASSWORD: postmark-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postmark-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postmark-postgres-data:
