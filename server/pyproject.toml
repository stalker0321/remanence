[project]
name = "remanence-server"
version = "0.1.0"
description = "Remanence server for account routing and ciphertext storage."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "tink==1.16.1",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "remanence"

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]
