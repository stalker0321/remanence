syntax = "proto3";

package remanence.recognition.v2;

option java_package = "dev.hryshyn.remanence.recognition.v2";
option java_multiple_files = true;
option java_outer_classname = "RecognitionV2";
option optimize_for = LITE_RUNTIME;

// P0 contract only. No extractor, matcher, manifest, or runtime reader is
// introduced by this schema.
message SiftRootSiftFingerprint {
  uint32 format_version = 1; // exactly 3
  string recognition_profile_id = 2; // exactly postcard-sift-rootsift-v1
  uint32 canonical_width_px = 3;
  uint32 canonical_height_px = 4;
  fixed64 coarse_hash64 = 5;
  repeated Keypoint keypoints = 6; // exactly 1..1500
  bytes quantized_sift_descriptors = 7; // exactly 128 bytes per keypoint

  message Keypoint {
    uint32 x_micro = 1; // normalized coordinate * 1_000_000
    uint32 y_micro = 2; // normalized coordinate * 1_000_000
    uint32 scale_micro = 3; // normalized scale * 1_000_000
    uint32 angle_centi_degrees = 4; // 0..35_999
    uint32 response_quantized = 5; // bounded non-negative metadata
    sint32 octave = 6; // -8..8
  }
}
