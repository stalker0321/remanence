syntax = "proto3";

package remanence.recognition.v1;

option java_package = "dev.hryshyn.remanence.recognition.v1";
option java_multiple_files = true;
option java_outer_classname = "RecognitionV1";
option optimize_for = LITE_RUNTIME;

// Versioned local postcard fingerprint (docs/recognition.md section 6).
// Deterministic integer encodings only: normalized coordinates and quality
// signals use fixed-point micro units (value * 1e6), angles use hundredths
// of a degree. No floats, maps, or locale-dependent values.
message PostcardFingerprint {
  uint32 format_version = 1; // exactly 1
  string recognition_profile_id = 2;
  Side side = 3;
  uint32 canonical_width_px = 4;
  uint32 canonical_height_px = 5;
  fixed64 coarse_hash64 = 6;
  repeated Keypoint keypoints = 7; // bounded to profile nfeatures cap
  bytes orb_descriptors = 8; // 32 bytes per keypoint, row-major
  ExtractionQuality extraction_quality = 9;

  enum Side {
    SIDE_UNSPECIFIED = 0;
    FRONT = 1;
    BACK = 2;
  }

  message Keypoint {
    uint32 x_micro = 1; // x / canonical_width * 1e6, <= 1_000_000
    uint32 y_micro = 2; // y / canonical_height * 1e6, <= 1_000_000
    uint32 scale_micro = 3; // scale * 1e6
    uint32 angle_centi_degrees = 4; // < 36000
    uint32 response_quantized = 5;
    sint32 octave = 6; // -8..8
  }

  message ExtractionQuality {
    uint32 blur_score_micro = 1;
    uint32 exposure_score_micro = 2;
    uint32 glare_fraction_micro = 3; // <= 1_000_000
    uint32 detected_area_ratio_micro = 4; // <= 1_000_000
  }
}
