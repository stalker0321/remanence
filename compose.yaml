services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: remanence
      POSTGRES_USER: remanence
      POSTGRES_PASSWORD: ${REMANENCE_DEV_DB_PASSWORD:-remanence-dev-only}
    ports:
      - "127.0.0.1:${REMANENCE_DB_PORT:-55432}:5432"
    volumes:
      - remanence-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: remanence-api:m0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      REMANENCE_MODE: dev
      REMANENCE_DATABASE_URL: postgresql+psycopg://remanence:${REMANENCE_DEV_DB_PASSWORD:-remanence-dev-only}@postgres:5432/remanence
      REMANENCE_BLOB_ROOT: /var/lib/remanence/blobs

  api:
    image: remanence-api:m0
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      REMANENCE_MODE: dev
      REMANENCE_DATABASE_URL: postgresql+psycopg://remanence:${REMANENCE_DEV_DB_PASSWORD:-remanence-dev-only}@postgres:5432/remanence
      REMANENCE_BLOB_ROOT: /var/lib/remanence/blobs
    ports:
      - "127.0.0.1:${REMANENCE_API_PORT:-8000}:8000"
    volumes:
      - remanence-blob-data:/var/lib/remanence/blobs
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  remanence-postgres-data:
  remanence-blob-data:
