<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c1a17'/%3E%3C/svg%3E" />
    <title>Remanence fixture harness</title>
    <style>
      body { margin: 0; background: #1c1a17; color: #f4f2ec; font: 18px Georgia, serif; }
      .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
      canvas { width: min(32vw, 280px); height: auto; background: #111; }
      button { min-height: 48px; margin: 0 8px 12px; }
      @media (max-width: 500px) {
        .row { display: block; }
        canvas { width: calc(100vw - 24px); }
      }
    </style>
  </head>
  <body>
    <p id="locale">en</p>
    <p lang="ru">заметка</p>
    <p lang="uk">нотатка</p>
    <button type="button" id="ru">ru</button>
    <button type="button" id="uk">uk</button>
    <div class="row">
      <canvas id="plain" width="360" height="640"></canvas>
      <canvas id="cover" width="360" height="640"></canvas>
      <canvas id="overflow" width="360" height="640"></canvas>
      <canvas id="received" width="360" height="640"></canvas>
    </div>
    <script src="/boot.js"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
